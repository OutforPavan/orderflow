spring.application.name=orderflow
spring.config.import=optional:file:.tools/database.properties
learning.message=LearningService - Learning Spring Boot one step at a time
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# Flyway owns schema changes; Hibernate checks that entity mappings match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

# Server-owned 10% campaign. Enable all products OR list eligible product IDs.
# Defaults preserve existing orders' full-price behavior for new requests.
pricing.discount-all-products=false
pricing.discount-product-ids=
