spring.application.name=orderflow
spring.config.import=optional:file:.tools/database.properties
learning.message=LearningService - Learning Spring Boot one step at a time
spring.jackson.deserialization.accept-float-as-int=false

# Flyway owns schema changes; Hibernate checks that entity mappings match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
